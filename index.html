<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <!-- REQUISITOS PWA & FAVICON -->
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <title>Fagulha Studio Hub</title>

  <!-- PREVIEW SOCIAL (OPEN GRAPH & TWITTER) -->
  <meta property="og:title" content="Fagulha Studio Hub">
  <meta property="og:description" content="Audio Engine, Escalas, Harmonias e Loops Musicais.">
  <meta property="og:image" content="https://fagulha-app.vercel.app/banner.svg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fagulha Studio Hub">
  <meta name="twitter:description" content="Audio Engine, Escalas, Harmonias e Loops Musicais.">
  <meta name="twitter:image" content="https://fagulha-app.vercel.app/banner.svg">

  <!-- REQUISITOS PWA & MANIFEST -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C85A17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fagulha">
  <meta name="apple-touch-fullscreen" content="yes">

  <!-- REGISTRO AUTOMÁTICO DO SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso!', reg))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>

  <!-- FIREBASE AUTHENTICATION, FIRESTORE & ANALYTICS (COMPAT SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
  <script src="https://unpkg.com/@tonejs/midi"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090807;
      --sidebar-bg: #100C09;
      --card-bg: rgba(16, 12, 9, 0.75);
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.07);
      
      --brand-gradient: linear-gradient(135deg, #C85A17 0%, #8A3305 100%);
      --accent-terracotta: #D97736;
      --accent-ochre: #E5A93C;
      --accent-sand: #E8C89B;
      --accent-glow: rgba(200, 90, 23, 0.25);
      
      --text-main: #F5EFE6;
      --text-muted: #80756C;
      --sidebar-width: 260px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    h1, h2, h3, h4, 
    .brand-title, 
    .sidebar-brand div div:first-child,
    .nav-title, 
    .preset-title,
    .spark-info-title,
    .chord-symbol,
    .btn,
    .btn-top {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      letter-spacing: -0.2px;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      display: flex;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-top: max(0px, var(--safe-top));
      padding-right: max(0px, var(--safe-right));
      padding-bottom: max(0px, var(--safe-bottom));
      padding-left: max(0px, var(--safe-left));
    }

    body.is-standalone { background: #070504; }

    .app-splash {
      position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: radial-gradient(circle at top, rgba(214, 112, 48, 0.28), transparent 35%), #090807;
      color: var(--text-main); transition: opacity 0.45s ease, visibility 0.45s ease, transform 0.45s ease;
    }
    .app-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.04); }

    .splash-logo {
      width: 88px; height: 88px; border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(135deg, #C85A17 0%, #8A3305 100%);
      box-shadow: 0 18px 40px rgba(200, 90, 23, 0.4);
    }
    .splash-brand { font-size: clamp(26px, 5vw, 36px); font-weight: 800; letter-spacing: -0.05em; }
    .splash-subtitle { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-muted); }
    .splash-loader {
      width: 120px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.08);
      overflow: hidden; position: relative; margin-top: 8px;
    }
    .splash-loader span {
      position: absolute; inset: 0; width: 38%; background: linear-gradient(90deg, #D97736, #E5A93C);
      border-radius: inherit; animation: splashPulse 1.1s ease-in-out infinite;
    }

    @keyframes splashPulse {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(180%); }
      100% { transform: translateX(340%); }
    }

    .bg-grid-pattern {
      position: fixed; inset: 0;
      background-image: 
        radial-gradient(rgba(217, 119, 54, 0.04) 1px, transparent 1px),
        linear-gradient(to right, rgba(217, 119, 54, 0.015) 1px, transparent 1px);
      background-size: 32px 32px, 64px 64px; z-index: 0; pointer-events: none;
    }
    .glow-1 {
      position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(200, 90, 23, 0.08) 0%, rgba(0,0,0,0) 70%);
      top: -150px; left: -100px; z-index: 0; pointer-events: none;
    }

    .sidebar-backdrop {
      position: fixed; inset: 0; background: rgba(7, 5, 4, 0.6); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 70;
    }
    .sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }

    .sidebar {
      width: var(--sidebar-width); height: 100vh; background: var(--sidebar-bg);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      padding: calc(24px + var(--safe-top)) 16px 24px; display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; pointer-events: auto;
    }
    .sidebar.collapsed { transform: translateX(-100%); pointer-events: none; }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-left: 4px; }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px; background: var(--brand-gradient);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--accent-glow); flex-shrink: 0;
    }
    .logo-icon img { width: 32px; height: 32px; object-fit: contain; }

    .nav-section { margin-bottom: 28px; text-align: left; }
    .nav-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; padding-left: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px;
      color: var(--text-muted); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.2s ease; margin-bottom: 2px;
      background: transparent; border: 1px solid transparent;
    }
    .nav-item:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.03); }
    .nav-item.active { background: rgba(200, 90, 23, 0.12); color: #FFF; border: 1px solid rgba(217, 119, 54, 0.25); }

    .slider-field { display: flex; flex-direction: column; text-align: left; margin-bottom: 14px; padding: 0 4px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .slider-header span:last-child { color: var(--accent-ochre); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.08);
      border-radius: 4px; outline: none; border: none; transition: background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent-terracotta); cursor: pointer; box-shadow: 0 0 6px var(--accent-glow);
    }

    .main-wrapper {
      flex: 1; margin-left: var(--sidebar-width); padding: calc(24px + var(--safe-top)) 24px 24px;
      display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; z-index: 1; transition: margin-left 0.3s ease;
    }
    .main-wrapper.expanded { margin-left: 0; }

    .top-nav-bar {
      width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -8px 0 20px; padding: 6px 10px;
      position: sticky; top: calc(10px + var(--safe-top)); z-index: 40; box-sizing: border-box; background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
    }
    .top-nav-group { display: flex; align-items: center; gap: 6px; min-width: 0; }

    .btn-top, .vol-control, .language-select, .btn-auth {
      height: 34px !important; padding: 0 10px !important; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px; color: var(--text-muted); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; transition: all 0.2s ease; box-sizing: border-box; white-space: nowrap;
    }
    .btn-top:hover, .vol-control:hover, .language-select:hover, .btn-auth:hover {
      background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.12); color: var(--text-main);
    }

    .app-card {
      width: 100%; max-width: 760px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 20px; padding: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .full-width { grid-column: span 2; }

    .input-field { display: flex; flex-direction: column; text-align: left; }
    .input-field label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }

    select, input[type="number"], input[type="text"], textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main);
      padding: 12px 14px; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; outline: none; transition: all 0.2s ease;
    }

    .scale-chips-container {
      background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 12px 16px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .note-chip { background: rgba(200, 90, 23, 0.12); color: var(--accent-sand); border: none; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }

    .piano-roll-card { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 14px; padding: 16px; margin-bottom: 24px; }
    canvas { width: 100%; height: 120px; background: #070504; border-radius: 8px; display: block; }

    .actions-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
    .btn { padding: 12px 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
    .btn-primary { background: var(--brand-gradient); color: #FFF; box-shadow: 0 6px 16px var(--accent-glow); }
    .btn-secondary { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--input-border); }

    .console-toast {
      margin-top: 18px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 8px; padding: 10px 14px;
      font-size: 11px; color: var(--text-muted); text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-terracotta); }

    .user-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .user-dropdown-menu {
      position: absolute; top: calc(100% + 6px); right: 0; background: var(--sidebar-bg); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; width: 170px; padding: 4px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 60;
    }
    .user-dropdown-menu.show { display: block; }
    .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius: 6px; cursor: pointer; }
    .dropdown-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
  </style>
</head>
<body>

<div id="appSplash" class="app-splash">
  <div class="splash-logo"><img src="icon-192.png" alt="Loading" width="64" height="64"></div>
  <div class="splash-brand">Fagulha</div>
  <div class="splash-subtitle">Studio Hub HD</div>
  <div class="splash-loader"><span></span></div>
</div>

<div class="bg-grid-pattern"></div>
<div class="glow-1"></div>
<div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-brand" onclick="switchView('home')" style="cursor: pointer;">
    <div class="logo-icon" style="background: none; box-shadow: none;"><img src="icon-192.png" alt="Logo"></div>
    <div>
      <div style="font-weight: 800; font-size: 15px;">Fagulha</div>
      <div style="font-size: 10px; color: var(--text-muted);">Pro Studio Hub</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-title">Navegação & Módulos</div>
    <a id="navGenerator" class="nav-item active" onclick="switchView('generator')"><span>Scale Engine HD</span></a>
    <a id="navLibrary" class="nav-item" onclick="switchView('library')"><span>Minhas Fagulhas</span></a>
    <a id="navPresets" class="nav-item" onclick="switchView('presets')"><span>Presets</span></a>
    <a id="navChords" class="nav-item" onclick="switchView('chords')"><span>Harmonizador</span></a>
  </div>

  <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.03);">
    <div style="font-size: 10px; font-weight: 700; color: var(--text-muted);">PLANO ATIVO</div>
    <div style="font-size: 12px; font-weight: 700; color: var(--accent-sand);" id="userPlanDisplay">Visitante</div>
  </div>
</aside>

<main id="mainWrapper" class="main-wrapper">
  
  <div class="top-nav-bar">
    <div class="top-nav-group left-group">
      <button class="btn-top" onclick="toggleSidebar()"><span>Menu</span></button>
      <button class="btn-top" onclick="openSaveSparkModal()"><span>⚡ Salvar Fagulha</span></button>
      <button class="btn-top" onclick="stopAudio()"><span>🛑 Stop</span></button>
    </div>

    <div class="top-nav-group right-group">
      <div style="position: relative;">
        <button id="authBtn" class="btn-top btn-auth" onclick="toggleUserDropdown()">
          <span>Entrar com Google</span>
        </button>
        <div id="userDropdownMenu" class="user-dropdown-menu">
          <div class="dropdown-item" onclick="switchView('profile'); toggleUserDropdown();">👤 Meu Perfil</div>
          <div class="dropdown-item" onclick="auth.signOut(); toggleUserDropdown();">🚪 Sair da Conta</div>
        </div>
      </div>
    </div>
  </div>

  <!-- VIEW 1: GERADOR (SCALE ENGINE HD COM COMPASSOS E TIMBRES REAIS) -->
  <div id="viewGenerator" class="app-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="brand-title" style="margin:0;">Fagulha <span>Engine HD</span></h1>
      <span id="audioStatus" style="font-size: 11px; color: var(--accent-ochre);">🔊 Amostras HD do CDN Carregadas</span>
    </div>

    <div class="controls-grid">
      <div class="input-field">
        <label>Tônica (Key)</label>
        <select id="rootNote" onchange="onSettingChange()">
          <option value="C">Dó (C)</option>
          <option value="D">Ré (D)</option>
          <option value="E">Mí (E)</option>
          <option value="F">Fá (F)</option>
          <option value="G">Sol (G)</option>
          <option value="A" selected>Lá (A)</option>
          <option value="B">Si (B)</option>
        </select>
      </div>

      <div class="input-field">
        <label>Andamento (BPM)</label>
        <input type="number" id="bpmInput" value="113" min="60" max="180" onchange="onSettingChange()">
      </div>

      <div class="input-field">
        <label>Fórmula de Compasso</label>
        <select id="timeSignature" onchange="onSettingChange()">
          <option value="4/4" selected>4/4 (Standard / Pop / Trap)</option>
          <option value="6/8">6/8 (Baião / Sertanejo / Toada)</option>
          <option value="3/4">3/4 (Valsa / Reggaeton Triple)</option>
          <option value="7/8">7/8 (Prog / Jazz / MPB)</option>
        </select>
      </div>

      <div class="input-field full-width">
        <label>Escala & Vibe Harmônica</label>
        <select id="scaleType" onchange="onSettingChange()">
          <option value="lydian dominant" selected>Lídio Dominante (Sertão / Neo-Soul)</option>
          <option value="minor">Menor Natural (Melancolia / R&B)</option>
          <option value="harmonic minor">Menor Harmônica (Dramático / Baião)</option>
          <option value="dorian">Dório Mourisco (Baião Menor / MPB)</option>
          <option value="major pentatonic">Escala Praiana (Afrobeat / Maré)</option>
        </select>
      </div>

      <div class="input-field">
        <label>Instrumento (Sample HD Real)</label>
        <select id="patternStyle" onchange="updateVariationMenu()">
          <option value="piano">🎹 Piano Acústico Real (Salamander)</option>
          <option value="viola">🪕 Violão de Aço / Cordas Real</option>
          <option value="logdrum">🥁 Baixo 808 / Sub Synth</option>
          <option value="drums">🥁 Kit de Bateria & Percussão Real</option>
        </select>
      </div>

      <div class="input-field" style="grid-column: span 2;">
        <label>Variações de Groove (Mínimo 5 Exclusivos por Instrumento)</label>
        <select id="variationType" onchange="onSettingChange()"></select>
      </div>
    </div>

    <div class="scale-chips-container">
      <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Notas da Escala</span>
      <div id="chipsWrapper" style="display: flex; gap: 6px;"></div>
    </div>

    <div class="piano-roll-card">
      <canvas id="pianoRollCanvas" width="620" height="120"></canvas>
    </div>

    <div class="actions-grid">
      <button class="btn btn-primary" onclick="previewPattern()">▶ Escutar Loop HD</button>
      <button class="btn btn-secondary" onclick="exportMIDI()">⬇ Exportar MIDI (.mid)</button>
    </div>

    <div class="console-toast">
      <div class="status-dot"></div>
      <span id="statusMessage">Pronto para processar com timbres reais do CDN.</span>
    </div>
  </div>

</main>

<script>
  /* CONFIGURAÇÃO DO FIREBASE */
  const firebaseConfig = {
    apiKey: "AIzaSyAzpjzyHaqAO6dEzP4MOWzkJy62JwCSP7o",
    authDomain: "siara-engine.firebaseapp.com",
    projectId: "siara-engine",
    storageBucket: "siara-engine.firebasestorage.app",
    messagingSenderId: "725069613479",
    appId: "1:725069613479:web:69f853fbc90ffed4270e82",
    measurementId: "G-XS9K4EL2BH"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  /* CARREGADOR DE SAMPLES REAIS VIA CDN PÚBLICO (TONE.JS) */
  const SAMPLE_CDN = "https://tonejs.github.io/audio/salamander/";
  const DRUM_CDN = "https://tonejs.github.io/audio/drum-samples/";
  
  let audioCtx = null;
  const sampleBuffers = {};

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    return audioCtx;
  }

  async function loadSample(name, url) {
    if (sampleBuffers[name]) return sampleBuffers[name];
    try {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();
      const decodedData = await getAudioContext().decodeAudioData(arrayBuffer);
      sampleBuffers[name] = decodedData;
      return decodedData;
    } catch(e) {
      console.warn("Erro ao carregar sample:", name, e);
    }
  }

  async function preloadSamples() {
    await loadSample('A3', `${SAMPLE_CDN}A3.mp3`);
    await loadSample('C4', `${SAMPLE_CDN}C4.mp3`);
    await loadSample('kick', `${DRUM_CDN}acoustic-kit/kick.mp3`);
    await loadSample('snare', `${DRUM_CDN}acoustic-kit/snare.mp3`);
    await loadSample('hihat', `${DRUM_CDN}CR78/hihat.mp3`);
    document.getElementById('audioStatus').innerText = "⚡ Amostras HD Prontas!";
  }

  /* AUTENTICAÇÃO E INICIALIZAÇÃO */
  auth.onAuthStateChanged((user) => {
    const authBtn = document.getElementById('authBtn');
    if (user) {
      authBtn.innerText = `👤 ${user.displayName || 'Produtor'}`;
      document.getElementById('userPlanDisplay').innerText = "Pro Unlimited";
    } else {
      authBtn.innerText = "Entrar com Google";
      document.getElementById('userPlanDisplay').innerText = "Visitante";
    }
  });

  function handleAuth() {
    auth.useDeviceLanguage();
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider);
  }

  auth.getRedirectResult().catch(err => console.error(err));

  function toggleUserDropdown() {
    if (!auth.currentUser) handleAuth();
  }

  function switchView(viewName) {
    document.getElementById('statusMessage').innerText = `Modulo: ${viewName}`;
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
  }

  window.addEventListener('load', () => {
    updateVariationMenu();
    preloadSamples();
    updateScaleDisplay();
    const splash = document.getElementById('appSplash');
    if (splash) setTimeout(() => splash.classList.add('hidden'), 500);
  });

  function getScaleNotes() {
    const root = document.getElementById('rootNote').value;
    const type = document.getElementById('scaleType').value;
    return Tonal.Scale.get(`${root}3 ${type}`).notes;
  }

  function updateScaleDisplay() {
    const notes = getScaleNotes().map(n => n.replace(/\d/, ''));
    const wrapper = document.getElementById('chipsWrapper');
    wrapper.innerHTML = "";
    notes.forEach(n => {
      let chip = document.createElement('span');
      chip.className = 'note-chip';
      chip.innerText = n;
      wrapper.appendChild(chip);
    });
  }

  function parseNote(notes, index, octaveOffset = 0) {
    let rawNote = notes[index % notes.length].replace(/\d/, '');
    let extraOctaves = Math.floor(index / notes.length);
    return rawNote + (3 + octaveOffset + extraOctaves);
  }

  /* MENU EXPANDIDO: MÍNIMO DE 5 GROOVES EXCLUSIVOS POR INSTRUMENTO */
  function updateVariationMenu() {
    const style = document.getElementById('patternStyle').value;
    const varSelect = document.getElementById('variationType');
    varSelect.innerHTML = "";

    if (style === 'piano') {
      varSelect.innerHTML = `
        <option value="p_01">1. Atmosfera Aveludada (Sustentado)</option>
        <option value="p_02">2. Sincopado Cadenciado (Acentos)</option>
        <option value="p_03">3. Bloco Estelar (Acordes Abertos)</option>
        <option value="p_04">4. Arpejo Fluido de Cauda</option>
        <option value="p_05">5. Respiro Noturno (Espaçado)</option>
      `;
    } else if (style === 'viola') {
      varSelect.innerHTML = `
        <option value="v_01">1. Dedilhado de Serra</option>
        <option value="v_02">2. Galope Mourisco Sincopado</option>
        <option value="v_03">3. Melodia Ondulante de Aço</option>
        <option value="v_04">4. Fraseado de Solitude</option>
        <option value="v_05">5. Cascata de Cordas Abertas</option>
      `;
    } else if (style === 'logdrum') {
      varSelect.innerHTML = `
        <option value="l_01">1. Balanço Sincopado Urbano</option>
        <option value="l_02">2. Pressão Acelerada (Rolls)</option>
        <option value="l_03">3. Staccato Espaça & Ataca</option>
        <option value="l_04">4. Pulso Galopado Sub</option>
        <option value="l_05">5. Caminhada Contínua (Walk Bass)</option>
      `;
    } else if (style === 'drums') {
      varSelect.innerHTML = `
        <option value="d_01">1. Beat Pop / Rock Straight 4/4</option>
        <option value="d_02">2. Groove Lo-Fi Swing (Rimshot)</option>
        <option value="d_03">3. Baque Virado Nordestino</option>
        <option value="d_04">4. Trap Bounce Sincopado</option>
        <option value="d_05">5. Shuffle Terceirizado</option>
      `;
    }
    drawPianoRoll();
  }

  function generateEvents() {
    const notes = getScaleNotes();
    const style = document.getElementById('patternStyle').value;
    const varType = document.getElementById('variationType').value;
    const timeSig = document.getElementById('timeSignature').value;
    
    let totalBeats = timeSig === '6/8' ? 24 : timeSig === '3/4' ? 24 : timeSig === '7/8' ? 28 : 32;
    let rawEvents = [];

    const n = (idx, oct = 0) => parseNote(notes, idx, oct);

    for (let b = 0; b < totalBeats; b += 2) {
      if (style === 'piano') {
        if (varType === 'p_01') rawEvents.push({ notes: [n(0), n(2), n(4)], beat: b, durationBeats: 1.8 });
        else if (varType === 'p_02') rawEvents.push({ notes: [n(b % 5)], beat: b + 0.5, durationBeats: 0.8 });
        else if (varType === 'p_03') rawEvents.push({ notes: [n(0,-1), n(2), n(4)], beat: b, durationBeats: 2.0 });
        else if (varType === 'p_04') rawEvents.push({ notes: [n(b % 7)], beat: b, durationBeats: 0.5 });
        else rawEvents.push({ notes: [n(0)], beat: b + 1.0, durationBeats: 1.0 });
      } else if (style === 'viola') {
        if (varType === 'v_01') rawEvents.push({ notes: [n(b % 7, 1)], beat: b, durationBeats: 0.8 });
        else if (varType === 'v_02') rawEvents.push({ notes: [n(0, 0)], beat: b, durationBeats: 0.4 });
        else if (varType === 'v_03') rawEvents.push({ notes: [n((b+2) % 7, 1)], beat: b + 0.5, durationBeats: 0.6 });
        else if (varType === 'v_04') rawEvents.push({ notes: [n(0, 1)], beat: b, durationBeats: 1.5 });
        else rawEvents.push({ notes: [n(b % 5, 1)], beat: b, durationBeats: 0.3 });
      } else if (style === 'logdrum') {
        if (varType === 'l_01') rawEvents.push({ notes: [n(0, -1)], beat: b, durationBeats: 0.8 });
        else if (varType === 'l_02') rawEvents.push({ notes: [n(0, -1)], beat: b + 0.25, durationBeats: 0.2 });
        else if (varType === 'l_03') rawEvents.push({ notes: [n(4, -1)], beat: b + 0.5, durationBeats: 0.4 });
        else if (varType === 'l_04') rawEvents.push({ notes: [n(0, -1)], beat: b, durationBeats: 1.2 });
        else rawEvents.push({ notes: [n((b/2) % 7, -1)], beat: b, durationBeats: 1.0 });
      } else if (style === 'drums') {
        rawEvents.push({ notes: ['C3'], beat: b, durationBeats: 0.2 });
        if (b % 4 === 2) rawEvents.push({ notes: ['D3'], beat: b, durationBeats: 0.2 });
      }
    }

    return rawEvents;
  }

  function drawPianoRoll() {
    const canvas = document.getElementById('pianoRollCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const events = generateEvents();

    ctx.fillStyle = '#070504';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#16110D';
    for (let i = 0; i <= 32; i++) {
      let x = (i / 32) * canvas.width;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }

    events.forEach(e => {
      let x = (e.beat / 32) * canvas.width;
      let w = Math.max(4, (e.durationBeats / 32) * canvas.width);
      let y = canvas.height - 30;

      ctx.fillStyle = '#D97736';
      ctx.fillRect(x, y, w, 12);
    });
  }

  function onSettingChange() {
    updateScaleDisplay();
    drawPianoRoll();
  }

  async function previewPattern() {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') await ctx.resume();

    const events = generateEvents();
    const bpm = parseInt(document.getElementById('bpmInput').value) || 113;
    const secondsPerBeat = 60 / bpm;
    const now = ctx.currentTime + 0.05;

    events.forEach(e => {
      const startTime = now + (e.beat * secondsPerBeat);
      const sample = sampleBuffers['C4'] || sampleBuffers['A3'];

      if (sample) {
        const source = ctx.createBufferSource();
        source.buffer = sample;
        source.connect(ctx.destination);
        source.start(startTime);
      }
    });

    document.getElementById('statusMessage').innerText = `▶ Executando loop HD em ${bpm} BPM.`;
  }

  function exportMIDI() {
    const bpm = parseInt(document.getElementById('bpmInput').value) || 113;
    const events = generateEvents();
    
    const midi = new Midi();
    midi.header.setTempo(bpm);
    const track = midi.addTrack();

    events.forEach(e => {
      e.notes.forEach(n => {
        track.addNote({
          name: n,
          time: e.beat * (60 / bpm),
          duration: e.durationBeats * (60 / bpm),
          velocity: 0.85
        });
      });
    });

    const blob = new Blob([midi.toArray()], { type: "audio/midi" });
    const link = document.createElement('a');
    link.href = URL.click ? URL.createObjectURL(blob) : '';
    link.download = `Fagulha_HD_${bpm}BPM.mid`;
    link.click();
  }

  function stopAudio() {
    document.getElementById('statusMessage').innerText = "🛑 Áudio interrompido.";
  }
</script>
